name: Production CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-gate:
    name: Code Quality & Verification
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://neondb_owner:dummy@ep-dummy.neon.tech/neondb?sslmode=require"
      DIRECT_URL: "postgresql://neondb_owner:dummy@ep-dummy.neon.tech/neondb?sslmode=require"
      AUTH_SECRET: "production-ci-mock-secret-key-32bytes-long"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Run Automated Test Suites (Vitest)
        run: npm run test

      - name: Verify Next.js Production Build
        run: npm run build
